<text x="600.0" y="29" text-anchor="middle" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#7f86a8">about.md</text>
<text x="56" y="96" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#b6ff3b">$ cat about.md</text><text x="56" y="146" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="24" font-weight="800" fill="#ff3d9a"># Hossein Banaei</text><text x="56" y="186" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#e6e9f5">Backend developer who lives in Go and ships end to end.</text><text x="56" y="222" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#e6e9f5">APIs, queues, live tracking, payments, monitoring and the frontend that sits on top.</text><text x="56" y="272" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#e6e9f5">I write code by hand AND vibe-code with AI. Both are tools; I pick the right one.</text><text x="56" y="308" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#e6e9f5">A year in QA taught me to think about failure first: edge cases, retries, bad input.</text><text x="56" y="344" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#e6e9f5">Now: building production-minded Go services, one clean layer at a time.</text><text x="56" y="380" font-family="'JetBrains Mono','SF Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" font-weight="400" fill="#e6e9f5">Always leveling up, in code and in life.</text>
<rect x="56" y="404" width="11" height="20" fill="#00e5ff">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>