  </linearGradient>
  <linearGradient id="fStatic" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff"/><stop offset="0.55" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff3d9a"/>
