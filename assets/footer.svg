<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Closing terminal prompt">
<defs>
  <linearGradient id="fAurora" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#8b5cff;#ff3d9a;#00e5ff" dur="8s" repeatCount="indefinite"/></stop>
